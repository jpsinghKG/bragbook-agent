[project]
name = "bragbook"
version = "0.1.0"
description = "Summarizes your work day from git, GitHub, and other sources into a brag book."
readme = "README.md"
authors = [
    { name = "Jai Preet Singh", email = "233284235+jpsinghKG@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.1.59",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic,google,openai]>=2.31.1",
    "pydantic-settings>=2.15.0",
    "pygithub>=2.9.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "schedule>=1.2.2",
    "typer>=0.27.1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
